<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard — ZYLO TWEAKS</title>
<style>
:root{--bg:#06080c;--side:#0a0e15;--card:#0d121b;--line:#1a2332;--text:#e6edf7;--dim:#7d8ba1;--faint:#4d5a70;--blue:#38bdf8;--green:#4ade80;--red:#f47280;
box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;color:var(--text);background:radial-gradient(900px 420px at 50% -80px,#7e22ce66,transparent),radial-gradient(700px 400px at 100% 0,#c026d322,transparent),#0a0612;padding:18px 14px 40px}
a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}button{cursor:pointer}
.back{display:block;max-width:1150px;margin:0 auto 12px;color:#cdb4f5;font-size:.88rem}
.win{max-width:1150px;margin:0 auto;display:grid;grid-template-columns:230px 1fr;background:var(--bg);border:1px solid #2a2140;border-radius:14px;overflow:hidden;min-height:640px;box-shadow:0 30px 80px #000a}
.sd{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column}
.lg{display:flex;align-items:center;gap:10px;padding:2px 6px 18px}.lg i{width:38px;height:38px;border-radius:10px;background:#111826;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;color:var(--green);font-size:1.2rem}
.lg b{display:block;font-size:.9rem;letter-spacing:.04em;line-height:1.1}.lg b span{color:var(--green)}.lg small{color:var(--faint);font-size:.66rem;letter-spacing:.1em}
.sl{font-size:.62rem;letter-spacing:.14em;color:var(--faint);padding:14px 8px 6px}
.nv{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--dim);font-size:.84rem;text-align:left;border-left:2px solid transparent}
.nv:hover{background:#111826;color:var(--text)}.nv.on{background:#10192a;color:var(--text);border-left-color:var(--green)}.nv span{width:16px;text-align:center;color:var(--faint)}.nv.on span{color:var(--green)}
.sf{margin-top:auto;padding:12px 8px 2px;font-size:.72rem;color:var(--faint);border-top:1px solid var(--line)}.sf b{color:var(--dim);display:block}
.mn{padding:22px 26px;display:flex;flex-direction:column;gap:18px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.hd h1{margin:0;font-size:1.25rem}.hd p{margin:3px 0 0;color:var(--faint);font-size:.8rem}
.sc{background:#6ee7b7;color:#052e1e;border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:.82rem;flex:none}.sc:hover{background:#86efac}
.lbl{font-size:.8rem;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:10px;display:flex;justify-content:space-between}.lbl span{color:var(--faint);font-weight:400;font-size:.7rem}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.cd small{color:var(--green);font-size:.66rem;letter-spacing:.1em;font-weight:700}.cd b{display:block;margin-top:8px;font-size:.95rem;overflow-wrap:anywhere}
.fn{text-align:center;padding:26px 18px 20px;border-color:#1d4a66;background:linear-gradient(180deg,#0c1a2a,var(--card))}
.fn .ic{width:54px;height:54px;border-radius:14px;margin:0 auto 10px;background:linear-gradient(135deg,#38bdf8,#2563eb);display:grid;place-items:center;font-weight:800;font-size:1.6rem;color:#fff}
.fn h3{margin:0;font-size:.95rem;letter-spacing:.06em}.fn p{margin:4px 0 2px;color:var(--dim);font-size:.72rem}.fn em{color:var(--faint);font-size:.68rem;font-style:normal;display:block;margin-bottom:14px}
.op{width:100%;background:var(--blue);color:#04202e;border:0;border-radius:8px;padding:11px;font-weight:800;font-size:.85rem}.op:hover{background:#7dd3fc}
.ls{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.t{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card);cursor:pointer}.t:last-child{border:0}
.t b{display:block;font-size:.9rem}.t small{color:var(--dim);font-size:.78rem}
.t input{appearance:none;flex:none;width:42px;height:24px;border-radius:12px;background:#1a2332;position:relative;cursor:pointer;transition:.2s}
.t input:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:.2s}
.t input:checked{background:#155e75}.t input:checked:after{left:21px;background:var(--blue)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--card);font-size:.85rem;color:var(--dim)}.bar b{color:var(--text)}
.bt{background:var(--blue);color:#04202e;border:0;border-radius:8px;padding:10px 16px;font-weight:800;font-size:.82rem}.bt:hover{background:#7dd3fc}
.gh{background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:.82rem;color:var(--text)}.gh:hover{border-color:var(--blue)}
details summary{cursor:pointer;color:var(--dim);font-size:.8rem}pre{background:#05070a;border:1px solid var(--line);border-radius:10px;padding:14px;font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--dim);overflow:auto;max-height:240px;margin:8px 0 0}
.nt{color:var(--faint);font-size:.76rem;line-height:1.5}.warn{border:1px solid #6b4a12;background:#1d1507;color:#fbbf24;border-radius:10px;padding:10px 14px;font-size:.8rem}
.ov{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:50;padding:20px;backdrop-filter:blur(4px)}
.oc{width:min(440px,100%);background:#070b12;border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center}
.oc .ic{width:58px;height:58px;border-radius:15px;margin:0 auto 10px;background:linear-gradient(135deg,#38bdf8,#2563eb);display:grid;place-items:center;font-weight:800;font-size:1.7rem}
.oc h3{margin:0 0 4px;letter-spacing:.08em;color:var(--blue)}.oc p{color:var(--dim);font-size:.85rem;margin:6px 0 16px}
.pb{height:5px;background:#1a2332;border-radius:3px;overflow:hidden}.pb i{display:block;height:100%;background:var(--blue);transition:width .5s}.pc{font-weight:800;margin-top:10px}
.oc ol{text-align:left;color:var(--dim);font-size:.85rem;padding-left:20px;line-height:1.7;margin:10px 0 18px}
@media(max-width:800px){body{padding:10px 8px 30px}.win{grid-template-columns:1fr}.sd{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:2px}.lg,.sl,.sf{display:none}.nv{white-space:nowrap;width:auto;border-left:0;border-bottom:2px solid transparent}.nv.on{border-bottom-color:var(--green)}.mn{padding:16px}.hd{flex-wrap:wrap}}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{display:flex;align-items:center;gap:8px;background:#0d121b;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:.76rem;color:var(--dim)}.chip:hover{border-color:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;background:#ef4444}.dot.on{background:var(--green);box-shadow:0 0 0 0 #4ade8088;animation:pl 1.8s infinite}@keyframes pl{70%{box-shadow:0 0 0 7px #4ade8000}}
.ci{flex:1;min-width:0;background:#05070a;border:1px solid var(--line);border-radius:8px;padding:10px 12px;letter-spacing:.3em;font-weight:700;text-transform:uppercase}.ci:focus{border-color:var(--blue);outline:0}
.st{list-style:none;margin:14px 0 6px;padding:0;text-align:left;max-height:260px;overflow:auto}
.st li{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--dim)}.st li small{display:block;color:var(--red);font-size:.74rem;margin-top:2px}
.st .si{width:18px;text-align:center;font-weight:800}.st .ok{color:var(--text)}.st .ok .si{color:var(--green)}.st .fail .si{color:var(--red)}.st .run .si{color:var(--blue);display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.bar2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.oc{max-height:92vh;overflow:auto}
.pg{display:flex;flex-direction:column;gap:12px}.pgg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pgb{background:#05070a;border:1px solid var(--line);border-radius:10px;padding:14px}.pgb small{color:var(--faint);font-size:.64rem;letter-spacing:.12em}
.big{font-size:2rem;font-weight:800;margin-top:4px}.big span{font-size:.9rem;color:var(--dim);font-weight:400}.big.dim{color:var(--faint)}.pgs{color:var(--dim);font-size:.74rem;margin-top:2px}
.pgc{border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.84rem;color:var(--dim)}.pgc.good{border-color:#14532d;color:var(--green)}
button:disabled{opacity:.5;cursor:wait}
</style>
</head>
<body>
<a class="back" href="index.html">← Back to site</a>
<div class="win" id="app"></div>
<script src="panel.js?v=4"></script>
<script src="dash.js?v=4"></script>
</body>
</html>
